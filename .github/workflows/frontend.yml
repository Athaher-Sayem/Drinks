name: Storefront checks

on:
  push:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORE_ENVIRONMENT: development
      STORE_DATABASE_URL: sqlite:///./storefront-ci.db
      STORE_ALLOWED_ORIGINS: '["http://127.0.0.1:4173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Initialize disposable demo API
        working-directory: backend
        run: |
          python -m app.cli init-env
          python -m alembic upgrade head
          python -m app.cli seed-demo
      - name: Start disposable API
        working-directory: backend
        run: python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log --no-proxy-headers > "$RUNNER_TEMP/store-api.log" 2>&1 &
      - name: Wait for API health
        run: curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:admin
        working-directory: frontend
